[package]
name = "server"
version = "0.1.10"
edition = "2021"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "clawladder-server"
path = "src/main.rs"

[dependencies]
clawladder-core = { path = "../core" }
axum = { version = "0.8", features = ["json", "ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
bytes = "1"
tracing = "0.1"
